name: Release Go

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - cmd/**
      - internal/**
      - web/**
      - go.mod
      - Dockerfile

permissions: {}

jobs:
  release:
    name: Create tag release
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@03595b5eaf44910cf239ff20904cc52d410f97d4 # v8.1.2
        id: semantic_release
        with:
          dry_run: false
          branch: main
          tag_format: v${version}
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}
